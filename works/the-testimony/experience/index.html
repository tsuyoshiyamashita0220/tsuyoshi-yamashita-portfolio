/* =========================================================
   2. 推理エンジン（純粋関数）
   ========================================================= */
const Engine = {
  byId(list,id){ return list.find(x=>x.id===id); },
  isUnlocked(cs, unlock, st){
    if(!unlock) return true;
    if(unlock.contradiction) return st.found.includes(unlock.contradiction);
    if(unlock.evidence){ const e=Engine.byId(cs.evidence, unlock.evidence); return !!e && Engine.isUnlocked(cs, e.unlock, st); }
    return false;
  },
  testimonies(cs, st){ return cs.testimonies.filter(t=>Engine.isUnlocked(cs,t.unlock,st)); },
  evidence(cs, st){ return cs.evidence.filter(e=>Engine.isUnlocked(cs,e.unlock,st)); },
  timeline(cs, st){
    return cs.timeline.filter(x=>Engine.isUnlocked(cs,x.unlock,st))
      .map(x=>{ const revealed = x.whoReveal && Engine.isUnlocked(cs,x.whoReveal,st); return {...x, text: revealed? x.whoReveal.text : x.text, unknown: x.whoUnknown && !revealed}; })
      .sort((a,b)=>Engine.toMin(a.time,a.day)-Engine.toMin(b.time,b.day));
  },
  toMin(s,day){ const [h,m]=s.split(":").map(Number); return (h+(day?24*day:0))*60+m; },
  judge(cs, st, tId, eId){
    const t=Engine.byId(cs.testimonies,tId), e=Engine.byId(cs.evidence,eId);
    if(!t||!e||!Engine.isUnlocked(cs,t.unlock,st)||!Engine.isUnlocked(cs,e.unlock,st)) return {result:"invalid"};
    const c = cs.contradictions.find(c=>c.testimony===tId && c.evidence.includes(eId));
    if(c){ return st.found.includes(c.id) ? {result:"already", c} : {result:"correct", c}; }
    const nm = cs.nearMiss.find(n=>n.testimony===tId && n.evidence.includes(eId));
    return {result:"wrong", message: nm? nm.message : "この2つは食い違っていない。時刻・人物・場所のどれがずれているか、見比べよう。"};
  },
  requiredFound(cs, st){ return cs.finalRequires.filter(id=>st.found.includes(id)).length; },
  finalUnlocked(cs, st){ return cs.finalRequires.every(id=>st.found.includes(id)); },
  hintTarget(cs, st){
    if(Engine.finalUnlocked(cs,st)) return "final";
    for(const cid of cs.hintOrder){
      if(st.found.includes(cid)) continue;
      const c=Engine.byId(cs.contradictions,cid);
      const tOk=Engine.isUnlocked(cs, Engine.byId(cs.testimonies,c.testimony).unlock, st);
      const eOk=c.evidence.some(eid=>Engine.isUnlocked(cs, Engine.byId(cs.evidence,eid).unlock, st));
      if(tOk&&eOk) return cid;
    }
    return null;
  },
  questionOptions(cs, q, st){
    if(q.options==="characters+outsider") return cs.characters.map(c=>({id:c.id,label:c.name+"（"+c.role+"）"})).concat([{id:"outsider",label:"外部の人物"}]);
    if(q.options==="evidence") return Engine.evidence(cs,st).map(e=>({id:e.id,label:e.name}));
    return q.options;
  },
  checkFinal(cs, answers){
    const wrong=[];
    for(const q of cs.solutions){
      const a=answers[q.id];
      if(q.type==="single"){ if(a!==q.answer) wrong.push(q.id); }
      else { const set=new Set(Array.isArray(a)?a:[]); const ok = q.answer.every(x=>set.has(x)) && (!q.exact || set.size===q.answer.length) && (!q.max || set.size<=q.max); if(!ok) wrong.push(q.id); }
    }
    return {correct: wrong.length===0, wrong};
  },
  rank(st){
    const m=st.wrongPairs + st.wrongFinal*2, h=st.hintsUsed;
    if(m===0&&h===0) return "S"; if(m<=2&&h<=1) return "A"; if(m<=6&&h<=4) return "B"; return "C";
  },
  /* --- 開発用：データ整合性と論理の検証 --- */
  validate(cs){
    const errs=[], ok=[];
    const T=new Set(cs.testimonies.map(t=>t.id)), E=new Set(cs.evidence.map(e=>e.id)), C=new Set(cs.contradictions.map(c=>c.id)), P=new Set(cs.characters.map(c=>c.id));
    const chkU=(u,where)=>{ if(!u) return; if(u.contradiction&&!C.has(u.contradiction)) errs.push(where+": 未定義の矛盾 "+u.contradiction); if(u.evidence&&!E.has(u.evidence)) errs.push(where+": 未定義の証拠 "+u.evidence); };
    cs.testimonies.forEach(t=>{ if(!P.has(t.char)) errs.push(t.id+": 未定義の人物"); chkU(t.unlock,t.id); });
    cs.evidence.forEach(e=>chkU(e.unlock,e.id));
    cs.timeline.forEach(x=>{ chkU(x.unlock,x.id); chkU(x.whoReveal,x.id); if(!/^\d\d:\d\d$/.test(x.time)) errs.push(x.id+": 時刻形式"); });
    cs.contradictions.forEach(c=>{ if(!T.has(c.testimony)) errs.push(c.id+": 証言ID "+c.testimony); c.evidence.forEach(e=>{ if(!E.has(e)) errs.push(c.id+": 証拠ID "+e); }); c.unlocks.testimonies.forEach(x=>{ if(!T.has(x)) errs.push(c.id+": 解放証言 "+x); }); c.unlocks.evidence.forEach(x=>{ if(!E.has(x)) errs.push(c.id+": 解放証拠 "+x); }); });
    cs.nearMiss.forEach((n,i)=>{ if(!T.has(n.testimony)) errs.push("nearMiss"+i); n.evidence.forEach(e=>{ if(!E.has(e)) errs.push("nearMiss"+i+":"+e); if(cs.contradictions.some(c=>c.testimony===n.testimony&&c.evidence.includes(e))) errs.push("nearMiss"+i+" が正解の組と重複"); }); });
    // unlocks と unlock 定義の一致
    cs.contradictions.forEach(c=>{ c.unlocks.testimonies.forEach(x=>{ const t=Engine.byId(cs.testimonies,x); if(!t.unlock||t.unlock.contradiction!==c.id) errs.push(x+" の解放条件が "+c.id+" と不一致"); }); c.unlocks.evidence.forEach(x=>{ const e=Engine.byId(cs.evidence,x); if(!e.unlock||e.unlock.contradiction!==c.id) errs.push(x+" の解放条件が "+c.id+" と不一致"); }); });
    // 到達可能性（循環依存があれば到達不能として検出される）
    const st={found:[]}; let changed=true, steps=0;
    while(changed && steps<100){ changed=false; steps++;
      for(const c of cs.contradictions){ if(st.found.includes(c.id)) continue;
        const t=Engine.byId(cs.testimonies,c.testimony);
        if(Engine.isUnlocked(cs,t.unlock,st) && c.evidence.some(e=>Engine.isUnlocked(cs,Engine.byId(cs.evidence,e).unlock,st))){ st.found.push(c.id); changed=true; } } }
    cs.contradictions.forEach(c=>{ if(!st.found.includes(c.id)) errs.push(c.id+": 到達不能（循環依存または前提欠落）"); });
    cs.evidence.forEach(e=>{ if(!Engine.isUnlocked(cs,e.unlock,st)) errs.push(e.id+": 取得不能"); });
    cs.finalRequires.forEach(id=>{ if(!C.has(id)) errs.push("finalRequires: "+id); });
    // 自己矛盾の禁止：ある矛盾の証言が、その矛盾自身で解放されてはならない
    cs.contradictions.forEach(c=>{ const t=Engine.byId(cs.testimonies,c.testimony); if(t.unlock&&t.unlock.contradiction===c.id) errs.push(c.id+": 自己参照"); });
    // 最終解答に必要な証拠がすべて取得可能
    const proof=cs.solutions.find(q=>q.options==="evidence");
    if(proof) proof.answer.forEach(e=>{ if(!E.has(e)) errs.push("proof: "+e); });
    // 真相開示の証拠参照
    cs.ending.steps.forEach((s,i)=>s.ev.forEach(e=>{ if(!E.has(e)) errs.push("ending"+i+": "+e); }));
    if(!cs.story||!cs.story.chapters.length) errs.push("story: 真相の短編がない");
    else cs.story.chapters.forEach((c,i)=>c.ev.forEach(e=>{ if(!E.has(e)) errs.push("story"+i+": "+e); }));
    // 正解判定の決定性：全組み合わせを2回判定して同じ結果
    const full={found:st.found.slice()};
    for(const t of cs.testimonies) for(const e of cs.evidence){ const a=Engine.judge(cs,full,t.id,e.id).result, b=Engine.judge(cs,full,t.id,e.id).result; if(a!==b) errs.push("非決定的: "+t.id+"×"+e.id); }
    // 解答の一意性（論理ソルバー）
    const sol=Engine.solve(cs);
    if(sol.candidates.length!==1) errs.push("犯人候補が一意でない: "+sol.candidates.join(","));
    else if(sol.candidates[0]!==Engine.byId(cs.solutions,"q_who").answer) errs.push("ソルバーの結論と正解が不一致");
    else if(sol.stagedOk===false) errs.push("偽装の実行者が候補に含まれない");
    else ok.push("ソルバー：犯人候補は "+sol.candidates[0]+" のみ（分岐数 "+sol.branches+"）");
    ok.push("到達可能な矛盾 "+st.found.length+"/"+cs.contradictions.length+"、取得可能な証拠 "+cs.evidence.length+"/"+cs.evidence.length);
    return {errors:errs, ok, reachableOrder:st.found};
  },
  /* 事実モデルから「指輪を取り出せた人物」を全分岐で列挙する */
  solve(cs){ const m=cs.facts.model; return m==="alibi" ? Engine.solveAlibi(cs) : m==="sealed" ? Engine.solveSealed(cs) : Engine.solveDoor(cs); },
  /* 密室型：閂の内側・一方向の足跡・体重から、最後に部屋の中にいた人物を絞る */
  solveSealed(cs){
    const F=cs.facts; let c=F.persons.filter(p=>!(F.alibis||{})[p]);
    if(F.sealed && F.atticOneWay) c=c.filter(p=>F.inside.includes(p));
    if(F.walkerKg) c=c.filter(p=>Math.abs(F.kg[p]-F.walkerKg)<=8);
    return {candidates:c, branches:1};
  },
  /* アリバイ型：死亡時刻に建物内にいて、所在の裏付けがない人物を列挙 */
  solveAlibi(cs){
    const F=cs.facts, m=s=>Engine.toMin(s), t=m(F.deathAt);
    const inside=new Set();
    F.door.slice().sort((a,b)=>m(a.t)-m(b.t)).forEach(d=>{ if(m(d.t)<=t){ d.type==="in"?inside.add(d.who):inside.delete(d.who); } });
    const cand=F.persons.filter(p=>inside.has(p) && !(F.alibis[p]||[]).some(([a,b])=>t>=m(a)&&t<=m(b)));
    return {candidates:cand, branches:1, stagedOk: !F.stagedBy || cand.includes(F.stagedBy)};
  },
  solveDoor(cs){
    const F=cs.facts, m=s=>Engine.toMin(s);
    const camOn=t=>F.cameraWindows.some(([a,b])=>t>=m(a)&&t<m(b));
    const evs=F.door.map(d=>({...d,tm:m(d.t)})).sort((a,b)=>a.tm-b.tm);
    let worlds=[{inside:new Set(), log:{}}];
    const removal=m(F.removalAt);
    let presentAtRemoval=[];
    for(const ev of evs){
      // 取り出し時刻を通過する直前に在室者を記録
      worlds.forEach(w=>{ if(w.snap===undefined && ev.tm>removal) w.snap=new Set(w.inside); });
      const next=[];
      for(const w of worlds){
        if(ev.type==="in"){ const n=new Set(w.inside); n.add(ev.who); next.push({inside:n, snap:w.snap, log:w.log}); continue; }
        let cands=[...w.inside];
        if(camOn(ev.tm) && F.cameraOut[ev.t]) cands=cands.filter(p=>p===F.cameraOut[ev.t]);
        for(const p of cands){ const n=new Set(w.inside); n.delete(p); next.push({inside:n, snap:w.snap, log:{...w.log,[ev.t]:p}}); }
      }
      worlds=next;
      // カメラ録画中は「映った以外の入室」はない（ログと一致）ことを前提とする
    }
    worlds.forEach(w=>{ if(w.snap===undefined) w.snap=new Set(w.inside); });
    const open=F.caseOpen.find(o=>o.t===F.removalOpenAt);
    const holders=F.keyHolders[open.key].filter(p=>!F.unavailable.includes(p));
    const cand=new Set();
    worlds.forEach(w=>w.snap.forEach(p=>{ if(holders.includes(p)) cand.add(p); }));
    return {candidates:[...cand], branches:worlds.length};
  }
};

/* =========================================================
   3. セーブ（バージョン付き・破損時復旧）
   ========================================================= */
const SAVE_KEY="testimony.save", SAVE_VERSION=1;
const Store = {
  data:null,
  fresh(){ return {version:SAVE_VERSION, settings:{sound:false, bgm:false, vol:1, reduceMotion:false, haptics:true}, cases:{}}; },
  freshCase(){ return {phase:"intro", found:[], findOrder:[], wrongPairs:0, wrongFinal:0, hintsUsed:0, hintLevel:{}, initialSuspect:null, suspectLog:[], seen:[], finalAnswers:{}, finalWrong:[], revealStep:0, startedAt:Date.now(), clearedAt:null}; },
  load(){
    let raw=null;
    try{ raw=localStorage.getItem(SAVE_KEY); }catch(e){ this.data=this.fresh(); this.unavailable=true; return; }
    if(!raw){ this.data=this.fresh(); return; }
    try{
      const d=JSON.parse(raw);
      if(!d||typeof d!=="object"||d.version!==SAVE_VERSION||typeof d.cases!=="object") throw new Error("version");
      const out=this.fresh();
      out.settings.sound=!!(d.settings&&d.settings.sound);
      out.settings.bgm=!!(d.settings&&d.settings.bgm);
      out.settings.vol=(d.settings&&[0,1,2].includes(d.settings.vol))?d.settings.vol:1;
      out.settings.reduceMotion=!!(d.settings&&d.settings.reduceMotion);
      out.settings.haptics=!(d.settings&&d.settings.haptics===false);
      if(CASES.some(c=>c.caseId===d.lastCase)) out.lastCase=d.lastCase;
      for(const cs of CASES){ const c=d.cases[cs.caseId]; if(c) out.cases[cs.caseId]=this.sanitize(cs,c); }
      this.data=out;
    }catch(e){
      try{ localStorage.setItem(SAVE_KEY+".broken", raw); }catch(_){}
      this.data=this.fresh(); this.recovered=true;
    }
  },
  sanitize(cs,c){
    const base={cleared:!!c.cleared, bestRank:["S","A","B","C"].includes(c.bestRank)?c.bestRank:null, clears:Number.isFinite(c.clears)?c.clears:0, state:null};
    const s=c.state, f=this.freshCase();
    if(s && typeof s==="object"){
      const C=new Set(cs.contradictions.map(x=>x.id));
      f.phase=["intro","hypo","investigate","final","reveal","result"].includes(s.phase)?s.phase:"investigate";
      f.found=Array.isArray(s.found)?s.found.filter(x=>C.has(x)):[];
      f.findOrder=Array.isArray(s.findOrder)?s.findOrder.filter(x=>C.has(x)):f.found.slice();
      ["wrongPairs","wrongFinal","hintsUsed","revealStep"].forEach(k=>{ f[k]=Number.isFinite(s[k])&&s[k]>=0?s[k]:0; });
      f.hintLevel=(s.hintLevel&&typeof s.hintLevel==="object")?s.hintLevel:{};
      f.initialSuspect=typeof s.initialSuspect==="string"?s.initialSuspect:null;
      f.suspectLog=Array.isArray(s.suspectLog)?s.suspectLog.slice(0,50):[];
      f.seen=Array.isArray(s.seen)?s.seen:[];
      f.finalAnswers=(s.finalAnswers&&typeof s.finalAnswers==="object")?s.finalAnswers:{};
      f.finalWrong=Array.isArray(s.finalWrong)?s.finalWrong:[];
      f.startedAt=s.startedAt||Date.now(); f.clearedAt=s.clearedAt||null;
      if((f.phase==="final"||f.phase==="reveal"||f.phase==="result") && !Engine.finalUnlocked(cs,f)) f.phase="investigate";
      base.state=f;
    }
    return base;
  },
  save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); }catch(e){} },
  caseRec(id){ if(!this.data.cases[id]) this.data.cases[id]={cleared:false,bestRank:null,clears:0,state:null}; return this.data.cases[id]; },
  reset(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} this.data=this.fresh(); }
};

/* =========================================================
   4. サウンド（Web Audio で合成・外部音源なし／初期はすべてオフ）
   BGM：場面ごとに自動で切り替わる（タイトル／導入／捜査／最終推理／真相／結果）
   効果音：操作・指摘・宣告・解放・ページめくり など
   ========================================================= */
const SND_N = m => 440*Math.pow(2,(m-69)/12);
function sndGraph(c){
  const g={c};
  g.master=c.createGain(); const lim=c.createDynamicsCompressor(); lim.threshold.value=-4; lim.knee.value=0; lim.ratio.value=20; lim.attack.value=.001; lim.release.value=.12; g.master.connect(lim); lim.connect(c.destination);  // 音割れ防止
  const comp=c.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=3; comp.attack.value=.01; comp.release.value=.25; comp.connect(g.master);
  g.sfx=c.createGain(); g.sfx.gain.value=2.2; g.sfx.connect(comp);  // 効果音はBGMより大きく（v8.4）
  g.bgm=c.createGain(); g.bgm.gain.value=0;
  g.duck=c.createGain();
  const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=5200;
  g.bgm.connect(g.duck); g.duck.connect(lp); lp.connect(comp);
  const len=Math.floor(c.sampleRate*2.4), ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.4); }
  g.rev=c.createConvolver(); g.rev.buffer=ir; const rr=c.createGain(); rr.gain.value=.5; g.rev.connect(rr); rr.connect(comp);
  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate), nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1; g.noiseBuf=nb;
  return g;
}
/* 音色（すべて合成） */
const SV = {
  env(g,dest,t,a,d,v,send){ const e=g.c.createGain(); e.gain.setValueAtTime(0.0001,t); e.gain.linearRampToValueAtTime(v,t+a); e.gain.exponentialRampToValueAtTime(0.0001,t+a+d); e.connect(dest); if(send){ const s=g.c.createGain(); s.gain.value=send; e.connect(s); s.connect(g.rev); } return e; },
  tone(g,dest,t,f,d,v,o={}){ const c=g.c, os=c.createOscillator(); os.type=o.type||"sine"; os.frequency.setValueAtTime(f,t); if(o.f2) os.frequency.exponentialRampToValueAtTime(o.f2,t+d); let n=os;
    if(o.lp){ const fl=c.createBiquadFilter(); fl.type="lowpass"; fl.frequency.value=o.lp; os.connect(fl); n=fl; }
    n.connect(SV.env(g,dest,t,o.a||.004,d,v,o.send)); os.start(t); os.stop(t+(o.a||.004)+d+.05); },
  bell(g,dest,t,f,d,v,send){ const c=g.c, car=c.createOscillator(), mod=c.createOscillator(), mg=c.createGain();
    car.frequency.value=f; mod.frequency.value=f*3.5; mg.gain.setValueAtTime(f*1.4,t); mg.gain.exponentialRampToValueAtTime(f*.05+1,t+d*.6);
    mod.connect(mg); mg.connect(car.frequency); car.connect(SV.env(g,dest,t,.003,d,v,send)); car.start(t); mod.start(t); car.stop(t+d+.05); mod.stop(t+d+.05); },
  piano(g,dest,t,f,d,v,send){ [[1,"triangle",1],[2,"sine",.32],[3,"sine",.1]].forEach(([m,ty,k])=>SV.tone(g,dest,t,f*m,d/m,v*k,{type:ty,a:.003,send})); },
  pad(g,dest,t,fs,d,v,send){ const c=g.c, fl=c.createBiquadFilter(); fl.type="lowpass"; fl.frequency.setValueAtTime(500,t); fl.frequency.linearRampToValueAtTime(900,t+d*.5); fl.frequency.linearRampToValueAtTime(500,t+d);
    const e=c.createGain(); e.gain.setValueAtTime(0.0001,t); e.gain.linearRampToValueAtTime(v,t+Math.min(.8,d*.4)); e.gain.setValueAtTime(v,t+d*.7); e.gain.linearRampToValueAtTime(0.0001,t+d); fl.connect(e); e.connect(dest);
    if(send){ const s=c.createGain(); s.gain.value=send; e.connect(s); s.connect(g.rev); }
    fs.forEach(f=>[-6,6].forEach(ct=>{ const o=c.createOscillator(); o.type="sawtooth"; o.frequency.value=f; o.detune.value=ct; o.connect(fl); o.start(t); o.stop(t+d+.05); })); },
  bass(g,dest,t,f,d,v){ SV.tone(g,dest,t,f,d,v,{type:"triangle",lp:420,a:.006}); SV.tone(g,dest,t,f/2,d,v*.5,{a:.006}); },
  noise(g,dest,t,d,v,o={}){ const c=g.c, s=c.createBufferSource(); s.buffer=g.noiseBuf; const fl=c.createBiquadFilter(); fl.type=o.type||"highpass"; fl.frequency.setValueAtTime(o.f||4000,t); if(o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2,t+d); fl.Q.value=o.q||.8;
    s.connect(fl); fl.connect(SV.env(g,dest,t,o.a||.002,d,v,o.send)); s.start(t,Math.random()*.5); s.stop(t+d+.05); },
  thump(g,dest,t,v,f1,f2,d){ SV.tone(g,dest,t,f1||120,d||.2,v,{f2:f2||45,a:.002}); }
};

const SND_OF_SCREEN = {title:"title", cases:"title", intro:"intro", hypo:"intro", hub:"investigate", final:"final", reveal:"reveal", result:"result"};
const Sound = {
  ctx:null, g:null, inst:null, old:[], timer:null, want:null, stats:{notes:0,sfx:0},
  vols:[.45,.75,1],
  ensure(){ if(!this.ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; try{ this.ctx=new AC(); this.g=sndGraph(this.ctx); }catch(e){ this.ctx=null; return null; } this.applyVol(); }
    if(this.ctx.state==="suspended" && !document.hidden) this.ctx.resume(); return this.ctx; },
  applyVol(){ if(!this.g) return; const s=Store.data.settings, v=this.vols[s.vol==null?1:s.vol]; const t=this.ctx.currentTime;

    clearInterval(this.timer); this.timer=null; },

let EMB_N=0;
function emblem(id){
  const inner=EMBLEMS[id]; if(!inner) return h("div",{"aria-hidden":"true"});
  // 静的な自作SVG定数のみを解析（ユーザー入力は含まない）
  const doc=new DOMParser().parseFromString('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice">'+inner.replace(/__U__/g,"em"+(++EMB_N))+'</svg>',"image/svg+xml");
  const svg=document.importNode(doc.documentElement,true); svg.setAttribute("aria-hidden","true"); svg.setAttribute("focusable","false"); return svg;
}
function haptic(pattern){ try{ if(Store.data.settings.haptics!==false && navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }
function keyArt(animate){
  // 静的な自作SVG定数のみを解析（ユーザー入力は含まない）
  const doc=new DOMParser().parseFromString('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img">'+FACE_ART+'</svg>',"image/svg+xml");
  const svg=document.importNode(doc.documentElement,true);
  svg.setAttribute("aria-hidden","true"); svg.setAttribute("focusable","false");
  if(animate) svg.classList.add("anim");
  return svg;
}
function toast(msg){ const t=h("div",{class:"toast",role:"status",text:msg}); layer.append(t); setTimeout(()=>t.remove(),2200); }
function closeOverlays(){ layer.querySelectorAll(".overlay,.objection").forEach(o=>o.remove()); }
function overlay(content,{center=false,label="ダイアログ",onClose}={}){
  closeOverlays();
  const sheet=h("div",{class:"sheet",role:"dialog","aria-modal":"true","aria-label":label}, content);
  const ov=h("div",{class:"overlay"+(center?" center":"")}, sheet);
  ov.addEventListener("click",e=>{ if(e.target===ov){ ov.remove(); onClose&&onClose(); } });
  ov._onClose=onClose;
  layer.append(ov);
  const f=sheet.querySelector("button"); if(f) f.focus({preventScroll:true});
  return ov;
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ const ov=layer.querySelector(".overlay"); if(ov){ ov.remove(); ov._onClose&&ov._onClose(); } } });
document.addEventListener("pointerdown",()=>{ const st=Store.data&&Store.data.settings; if(!st) return; if(st.sound||st.bgm) Sound.ensure(); if(st.bgm&&!Sound.inst) Sound.bgmOn(); },{passive:true});
document.addEventListener("visibilitychange",()=>{ if(!Sound.ctx) return; if(document.hidden){ if(Sound.ctx.state==="running") Sound.ctx.suspend(); } else { const st=Store.data.settings; if(st.sound||st.bgm) Sound.ctx.resume(); } });

        levels.slice(0,lv).map((x,i)=>h("div",{class:"card"},h("div",{class:"q-num",text:"HINT "+(i+1)}),h("div",{text:x}))),
        lv<levels.length? h("button",{class:"btn gold",onclick:()=>{ st.hintLevel[target]=lv+1; st.hintsUsed++; this.persist(); Sound.play("hint"); draw(); }}, lv===0?"ヒント1を見る":"もっと具体的に（ヒント"+(lv+1)+"）") : h("p",{class:"muted",style:"font-size:13px",text:"これ以上のヒントはありません。"}),
        h("button",{class:"btn ghost",onclick:()=>closeOverlays()},"閉じる"));
    };
    draw();
    overlay(body,{label:"ヒント"});
  },

  /* ---------- 最終推理 ---------- */
  render_final(){
    const cs=this.cs, st=this.st;
    const answers=st.finalAnswers;
    const wrap=h("div",{class:"stack",style:"margin-top:8px"});
    cs.solutions.forEach((q,qi)=>{
      const opts=Engine.questionOptions(cs,q,st);
      const block=h("div",{class:"q-block"+(st.finalWrong.includes(q.id)?" wrong":""),role:q.type==="single"?"radiogroup":"group","aria-label":q.title});
      const draw=()=>{
        fill(block,
          h("div",{class:"q-num",text:"Q"+(qi+1)+(q.type==="multi"?"　複数選択":"")}),
          h("div",{class:"q-title",text:q.title}),
          st.finalWrong.includes(q.id)?h("div",{style:"color:#ff8d8d;font-size:13px",text:"この項目は成立していない"}):null,
          opts.map(o=>{
            const checked = q.type==="single" ? answers[q.id]===o.id : (answers[q.id]||[]).includes(o.id);
            return h("button",{class:"opt"+(q.type==="multi"?" multi":""),role:q.type==="single"?"radio":"checkbox","aria-checked":String(checked),onclick:()=>{
              Sound.play("tap");
              if(q.type==="single") answers[q.id]=o.id;
              else { const a=new Set(answers[q.id]||[]); a.has(o.id)?a.delete(o.id):a.add(o.id); answers[q.id]=[...a]; }
              st.finalWrong=st.finalWrong.filter(x=>x!==q.id); block.classList.remove("wrong");
              this.persist(); draw(); }}, h("span",{class:"box","aria-hidden":"true"}), h("span",{text:o.label}));
          }));
      };
      draw(); wrap.append(block);
    });
    const submit=h("button",{class:"btn primary",style:"min-height:60px;font-family:var(--serif);font-size:19px",onclick:()=>this.submitFinal(submit)},"この推理を提出する");
    app.append(h("div",null,
      h("div",{class:"topbar"}, h("button",{class:"iconbtn",onclick:()=>{ this.setPhase("investigate"); this.go("hub"); }},"← 捜査"), h("div",{class:"ttl",text:"最終推理"}), h("button",{class:"btn gold small",onclick:()=>this.hint()},"ヒント")),
      h("div",{class:"final-head"},h("div",{class:"eyebrow",style:"color:var(--ink)",text:"Final deduction"}),h("h2",{text:"真相を、証明せよ。"})),
      h("p",{class:"muted",style:"font-size:14px;margin-top:8px",text:"これまでの証拠から、真相を組み立てよう。捜査画面にはいつでも戻れる。"}),
      wrap, h("div",{style:"margin-top:18px"},submit)));
  },
  async submitFinal(btn){
    if(this.busy) return;
    const cs=this.cs, st=this.st;
    const missing=cs.solutions.filter(q=>q.type==="single"? !st.finalAnswers[q.id] : !(st.finalAnswers[q.id]||[]).length);
    if(missing.length){ toast("未回答の項目があります（Q"+(cs.solutions.indexOf(missing[0])+1+"）")); return; }
    this.busy=true; btn.disabled=true;
    try{
      const r=Engine.checkFinal(cs,st.finalAnswers);
      if(r.correct){
        st.finalWrong=[]; st.revealStep=0; st.clearedAt=Date.now();
        st.suspectLog.push({at:"final",who:st.finalAnswers.q_who});
        const rank=Engine.rank(st), order=["S","A","B","C"];
        this.rec.cleared=true; this.rec.clears=(this.rec.clears||0)+1;
        if(!this.rec.bestRank || order.indexOf(rank)<order.indexOf(this.rec.bestRank)) this.rec.bestRank=rank;
        st.rank=rank;
        this.setPhase("reveal"); Sound.play("solve");
        const flash=h("div",{class:"flash"}); const obj=h("div",{class:"objection"}, h("div",{class:"stamp",text:"解明"}));
        layer.append(flash,obj); await wait(1200); flash.remove(); obj.remove();
        this.go("reveal");
      } else {
        st.wrongFinal++; st.finalWrong=r.wrong; this.persist(); Sound.play("wrong");
        this.go("final");
        const sh=overlay(h("div",{class:"stack"},
          h("div",{class:"eyebrow",style:"color:var(--red)",text:"Not proven"}),
          h("h2",null,"推理が成立しない"),
          h("p",{text:cs.solutions.length+"項目のうち、"+r.wrong.length+"項目が証拠と合っていない。赤枠の項目を見直そう。"}),
          h("button",{class:"btn",onclick:()=>closeOverlays()},"見直す"),
          h("button",{class:"btn gold",onclick:()=>{ closeOverlays(); this.hint(); }},"ヒントを見る"),
          h("button",{class:"btn ghost",onclick:()=>{ this.setPhase("investigate"); this.go("hub"); }},"捜査に戻る")
        ),{center:true,label:"最終推理の誤り"});
        sh.querySelector(".sheet").classList.add("shake");
      }
    } finally { this.busy=false; btn.disabled=false; }
  },

  /* ---------- 真相開示（短編小説） ---------- */
  render_reveal(){
    const cs=this.cs, st=this.st, chs=cs.story.chapters, N=chs.length;
    st.revealStep=Math.min(st.revealStep||0, N-1);
    const evName=id=>Engine.byId(cs.evidence,id).name;
    const list=h("div",null);
    const proof=h("details",{class:"proof"},
      h("summary",null,"証拠で見る真相（時系列）"),
      cs.ending.steps.map(s=>h("div",{class:"reveal-step"},
        h("div",{class:"t",text:s.time}),
        h("div",{class:"b"}, h("div",{text:s.text}), h("div",{class:"src"}, s.ev.map(e=>h("span",{class:"tag gold",text:evName(e)})))))));
    const toResult=h("button",{class:"btn primary",onclick:()=>{ Sound.play("tap"); this.setPhase("result"); this.go("result"); }},"結果を見る");
    const draw=(scroll)=>{
      list.replaceChildren(...chs.slice(0,st.revealStep+1).map((c,i)=>h("article",{class:"story-page"+(i===st.revealStep?" fade-in":"")},
        h("h3",{text:c.h}),
        c.p.map(t=>t.startsWith("〉")? h("p",{class:"aph",text:t.slice(1)}) : h("p",{text:t})),
        h("div",{class:"story-src"}, h("span",{text:"根拠："}), c.ev.map(e=>h("span",{class:"tag",text:evName(e)}))))));
      const last=st.revealStep>=N-1;
      next.style.display=last?"none":""; skip.style.display=last?"none":"";
      next.textContent="次の章へ（"+(st.revealStep+2)+"/"+N+"）";
      proof.style.display=last?"":"none"; toResult.style.display=last?"":"none";
      if(scroll){ const pages=list.querySelectorAll(".story-page"); const el=pages[pages.length-1]; if(el) el.scrollIntoView({block:"start",behavior:reduced()?"auto":"smooth"}); }
    };
    const next=h("button",{class:"btn primary",onclick:()=>{ Sound.play("page"); st.revealStep++; this.persist(); draw(true); }});
    const skip=h("button",{class:"btn ghost",onclick:()=>{ st.revealStep=N-1; this.persist(); draw(false); }},"すべて表示");
    app.append(h("div",null,
      h("div",{class:"topbar"}, h("span",{style:"width:44px"}), h("div",{class:"ttl",text:"真相"}), h("span",{style:"width:44px"})),
      h("div",{class:"reveal-head"},h("div",{class:"eyebrow",text:"CASE "+cs.no+"　The truth"}),h("h2",{text:cs.story.title})),
      list, h("div",{class:"stack",style:"margin-top:18px"},next,skip,proof,toResult)));
    draw(false);
  },
  /* ---------- 結果 ---------- */
  render_result(){
    Sound.play("rank");
    const cs=this.cs, st=this.st, rank=st.rank||Engine.rank(st);
    const mins=st.clearedAt? Math.max(1,Math.round((st.clearedAt-st.startedAt)/60000)) : "—";
    const nm=id=>this.charName(id);
    const truth=Engine.byId(cs.solutions,"q_who").answer;
    const firstNote = st.initialSuspect===truth ? cs.notes.culpritText
      : st.initialSuspect===cs.notes.decoy ? cs.notes.decoyText
      : st.initialSuspect==="unknown" ? "最初は判断を保留した。証拠が出そろうまで結論を急がない進め方だった。"
      : "最初に疑った"+nm(st.initialSuspect)+"は、真相とは関係がなかった。最初の印象は、証拠で何度でも書きかえられる。";
    const changes=st.suspectLog.filter(x=>x.at!=="start"&&x.at!=="final");
    const labelOf=at=>{ const c=Engine.byId(cs.contradictions,at); return c? "「"+c.title+"」の後" : at; };
    // key art legend: what the face really meant
    const ka=h("div",{class:"keyart"}, keyArt(false));
    const ring=h("div",{class:"hl",style:"opacity:0"}); ka.append(ring);
    let openK=null;
    const legend=h("div",{class:"legend"});
    const drawLegend=()=>fill(legend, (cs.artLegend||[]).map((x,i)=>h("button",{"aria-expanded":String(openK===i),onclick:()=>{ Sound.play("tap"); openK=openK===i?null:i; drawLegend(); placeRing(); }},
      h("span",{class:"lk",text:String(i+1).padStart(2,"0")}), h("span",{class:"lt"},h("b",{text:x.part}), openK===i?h("span",{text:x.meaning}):null))));
    const placeRing=()=>{ if(openK==null){ ring.style.opacity="0"; return; } const x=cs.artLegend[openK]; ring.style.opacity="1"; ring.style.left=(x.x-x.r)/10+"%"; ring.style.top=(x.y-x.r)/10+"%"; ring.style.width=ring.style.height=(x.r*2)/10+"%"; };
    if(cs.artLegend) drawLegend();
    app.append(h("div",null,
      h("div",{class:"topbar"}, h("button",{class:"iconbtn",onclick:()=>this.go("cases")},"← 一覧"), h("div",{class:"ttl",text:"捜査結果"}), h("span",{style:"width:44px"})),
      h("div",{class:"stack",style:"margin-top:16px"},
        h("div",{class:"eyebrow",style:"text-align:center",text:"CASE "+cs.no+" SOLVED"}),
        h("div",{class:"rank6"}, h("div",{class:"r6-emb"},emblem(cs.caseId)), h("div",{class:"rank",text:rank}), h("div",{class:"r6-cap",text:"CASE "+cs.no+"『"+cs.title+"』"})),
        h("p",{class:"muted",style:"text-align:center;font-size:13px",text:"評価はミスとヒントの数だけで決まります（S＝ミス・ヒントなし）"}),
        h("div",{class:"stat-grid"},
          [["発見した矛盾", st.found.length+"/"+cs.contradictions.length],["成立しなかった指摘", st.wrongPairs+"回"],["最終推理の誤り", st.wrongFinal+"回"],["使ったヒント", st.hintsUsed+"段階"],["所要時間（目安）", mins+(mins==="—"?"":"分")],["最高評価", this.rec.bestRank||rank]]
          .map(([k,v])=>h("div",{class:"stat"},h("div",{class:"v",text:v}),h("div",{class:"k",text:k})))),
        h("div",{class:"card stack"},
          h("div",{class:"eyebrow",text:"Your reasoning path"}),
          h("div",{class:"path"},
            h("div",{class:"path-item"},h("span",{class:"n",text:"①"}),h("span",{text:"最初の仮説："+nm(st.initialSuspect||"unknown")})),
            changes.map(x=>h("div",{class:"path-item"},h("span",{class:"n",text:"・"}),h("span",{text:labelOf(x.at)+"："+nm(x.who)}))),
            h("div",{class:"path-item"},h("span",{class:"n",text:"②"}),h("span",{text:"矛盾を見つけた順："+st.findOrder.map(id=>{const c=Engine.byId(cs.contradictions,id); return nm(Engine.byId(cs.testimonies,c.testimony).char).split(" ")[0];}).join(" → ")})),
            h("div",{class:"path-item"},h("span",{class:"n",text:"③"}),h("span",{text:"最終結論："+nm(truth)}))),
          h("p",{style:"font-size:14px",text:firstNote}),
          h("p",{class:"muted",style:"font-size:13px",text:cs.notes.summary})),
        (cs.notes.seeds&&cs.notes.seeds.length)? h("div",{class:"card stack seeds"},
          h("div",{class:"eyebrow",text:"The research behind"}),
          h("h3",{class:"serif",style:"font-size:19px;font-weight:900",text:"この謎の鍵になった研究"}),
          cs.notes.seeds.map(x=>h("div",{class:"seed"}, h("div",{class:"seed-no",text:x.no}),
            h("div",null, h("b",{class:"seed-t",text:x.title}), h("div",{class:"seed-who",text:x.who}), h("div",{class:"seed-use",text:x.use})))),
          h("p",{class:"muted",style:"font-size:12px",text:"出典：北九州学術研究都市「半導体関連大学研究シーズ集 2025」、共同研究開発センター「半導体研究・試作施設」案内。登場人物と事件は架空です。研究の中身は、謎解きのためにやさしく言いかえています。"})) : null,
        cs.artLegend? [h("div",{class:"eyebrow",style:"margin-top:12px",text:"Look again"}),
        h("h2",{class:"serif",style:"font-size:22px;font-weight:900",text:"この顔は、何でできていたか。"}),
        h("p",{class:"muted",style:"font-size:14px",text:"タイトルの顔をもう一度。番号をタップすると、その部分が示していた事実が分かります。"}),
        ka, legend] : null,
        h("button",{class:"btn primary",onclick:()=>this.retry()},"最初からもう一度"),
        h("button",{class:"btn",onclick:()=>this.go("cases")},"事件一覧へ"),
        h("button",{class:"btn ghost",onclick:()=>this.go("title")},"タイトルへ"))));
  },
  retry(){
    overlay(h("div",{class:"stack"},
      h("h2",null,"最初からやり直しますか？"),
      h("p",{class:"muted",text:"この事件の捜査状況を消して、導入から始めます。最高評価は残ります。"}),
      h("button",{class:"btn primary",onclick:()=>{ this.rec.state=Store.freshCase(); this.st=this.rec.state; this.sel={t:null,e:null}; this.openEv.clear(); Store.save(); this.go("intro"); }},"やり直す"),
      h("button",{class:"btn ghost",onclick:()=>closeOverlays()},"やめる")

  },

  /* ---------- 設定 ---------- */
  settings(){
    const s=Store.data.settings;
    const body=h("div",{class:"stack"});
    const tog=(key,label,desc)=>h("button",{class:"toggle",role:"switch","aria-checked":String(!!s[key]),onclick:()=>{ s[key]=!s[key]; if(key==="sound"&&s.sound){ Sound.ensure(); Sound.play("get"); } if(key==="bgm"){ if(s.bgm) Sound.bgmOn(); else Sound.bgmOff(); } applySettings(); Store.save(); draw(); }},
      h("span",null,h("div",{style:"font-weight:600",text:label}),h("div",{class:"muted",style:"font-size:12px",text:desc})), h("span",{class:"switch","aria-hidden":"true"}));
    const draw=()=>body.replaceChildren(
      h("h2",null,"設定"),
      tog("bgm","BGM（音楽）","初期状態はオフ。場面に合わせて曲が変わります。"),
      tog("sound","効果音","初期状態はオフ。オンにすると操作音や、矛盾を見抜いたときの音が鳴ります。"),
      h("div",{class:"volrow"}, h("span",{style:"font-weight:600",text:"音量"}),
        h("div",{class:"seg",role:"group","aria-label":"音量"}, ["小","中","大"].map((lb,k)=>h("button",{class:"segb","aria-pressed":String((s.vol==null?1:s.vol)===k),onclick:()=>{ s.vol=k; Store.save(); Sound.ensure(); Sound.applyVol(); Sound.play("tap"); draw(); }},lb)))),
      tog("reduceMotion","アニメーションを減らす","演出を短く・静かにします。"),
      tog("haptics","振動","矛盾を見抜いたときなどに振動します（対応端末のみ）。"),

          h("button",{class:"btn primary",onclick:()=>{ Store.reset(); applySettings(); this.cs=null; this.go("title"); toast("データを初期化しました"); }},"初期化する"),
          h("button",{class:"btn ghost",onclick:()=>this.settings()},"やめる")),{center:true,label:"初期化確認"}); }},"進捗データを初期化"),
      h("button",{class:"btn",onclick:()=>{ closeOverlays(); if(this.cs&&document.querySelector(".tabs")) this.go("hub"); }},"閉じる"));
    draw();
    overlay(body,{label:"設定"});
  }
};

/* ---------- 起動 ---------- */
Store.load(); applySettings();
window.__TESTIMONY={CASES,Engine,Store,App,Sound};
